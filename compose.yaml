name: dnd-campaign-manager

# Docker Compose fills in ${…} only from a .env next to this file, never from the apps' env files. The
# include hands them to the stack (compose.stack.yaml), so `docker compose up -d` works without a root
# .env. The profile (COMPOSE_PROFILES in apps/backend/.env) is not read this way: pass
# `--profile development` or use `npm run compose -- …`, which also reads the files as --env-file.
include:
  - path: compose.stack.yaml
    env_file:
      - apps/backend/.env
      - apps/frontend/.env
