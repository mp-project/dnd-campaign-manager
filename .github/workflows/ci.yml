name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: dnd_campaign_manager_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dnd_campaign_manager_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: 3000
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/dnd_campaign_manager_test
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5433/dnd_campaign_manager_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL: 7d
      LOG_LEVEL: warn
      CORS_ORIGIN: http://localhost:5173
      VITE_API_BASE_URL: http://localhost:3000/api/v1
      STORAGE_MAX_UPLOAD_BYTES: 5242880
      STORAGE_MAX_TOTAL_BYTES: 104857600
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
