name: dnd-campaign-manager

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    restart: always
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_REGION: ${RUSTFS_REGION}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${RUSTFS_API_PORT}:9000"
      - "${RUSTFS_DASHBOARD_PORT}:9001"
    volumes:
      - rustfs-data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    env_file:
      - ./apps/backend/.env
    environment:
      HOST: ${CONTAINER_HOST}
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${DB_INTERNAL_PORT}/${POSTGRES_DB}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-test:${DB_TEST_INTERNAL_PORT}/${POSTGRES_TEST_DB}
      VITE_API_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_API_URL}
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: smtp
      MAIL_FROM_ADDRESS: no-reply@${API_DOMAIN}
      MAIL_FROM_NAME: DnD Campaign Manager
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      MAILPIT_UI_URL: ${COMPOSE_MAILPIT_UI_URL}
      EMAIL_VERIFICATION_CODE_TTL_HOURS: 24
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${COMPOSE_STORAGE_S3_ENDPOINT}
      STORAGE_S3_DASHBOARD_URL: ${COMPOSE_STORAGE_S3_DASHBOARD_URL}
      STORAGE_S3_REGION: ${RUSTFS_REGION}
      STORAGE_S3_BUCKET: ${RUSTFS_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      STORAGE_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_AUTO_BOOTSTRAP: "false"
      STORAGE_S3_BOOTSTRAP_CORS_ORIGINS: ${COMPOSE_FRONTEND_PUBLIC_URL},http://app.localhost:5173
    depends_on:
      db:
        condition: service_healthy
      rustfs:
        condition: service_started
      mailpit:
        condition: service_started
    command: npm run db:migrate --workspace @dnd/backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: production
      HOST: ${CONTAINER_HOST}
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${DB_INTERNAL_PORT}/${POSTGRES_DB}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-test:${DB_TEST_INTERNAL_PORT}/${POSTGRES_TEST_DB}
      VITE_API_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_API_URL}
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: smtp
      MAIL_FROM_ADDRESS: no-reply@${API_DOMAIN}
      MAIL_FROM_NAME: DnD Campaign Manager
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      MAILPIT_UI_URL: ${COMPOSE_MAILPIT_UI_URL}
      EMAIL_VERIFICATION_CODE_TTL_HOURS: 24
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${COMPOSE_STORAGE_S3_ENDPOINT}
      STORAGE_S3_DASHBOARD_URL: ${COMPOSE_STORAGE_S3_DASHBOARD_URL}
      STORAGE_S3_REGION: ${RUSTFS_REGION}
      STORAGE_S3_BUCKET: ${RUSTFS_BUCKET}
      STORAGE_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY}
      STORAGE_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_AUTO_BOOTSTRAP: "true"
      STORAGE_S3_BOOTSTRAP_CORS_ORIGINS: ${COMPOSE_FRONTEND_PUBLIC_URL},http://app.localhost:5173
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs:
        condition: service_started
      mailpit:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_API_URL}
    depends_on:
      backend:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_PORT: ${BACKEND_PORT}
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db-test:
    image: postgres:18
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "${TEST_DB_PORT}:${DB_TEST_INTERNAL_PORT}"
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_TEST_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  tests:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    profiles: ["test"]
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${DB_INTERNAL_PORT}/${POSTGRES_DB}
      TEST_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db-test:${DB_TEST_INTERNAL_PORT}/${POSTGRES_TEST_DB}
      VITE_API_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_API_URL}
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: noop
      MAIL_FROM_ADDRESS: no-reply@example.test
      MAIL_FROM_NAME: DnD Tests
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      EMAIL_VERIFICATION_CODE_TTL_HOURS: 24
    depends_on:
      db-test:
        condition: service_healthy
    command: npm run test:integration --workspace @dnd/backend

volumes:
  postgres-data:
  rustfs-data:
  caddy-data:
  caddy-config:
