# Frontend in production: static files behind Caddy (TLS, compression).
# - Prerendered public pages are served as they are (/faq -> /faq/index.html).
# - The app's areas get the app (app.html) with 200; the app decides there (sign-in, account,
#   campaigns). Every other address is unknown: status 404 with the prerendered not-found page
#   (404.html), so search engines see a real 404 instead of a page that only says so.
# - One address per page: a trailing slash redirects to the address without it.
# - Files with a hash in their name never change and are cached for a year; everything else
#   (HTML, robots.txt, sitemap.xml, the service worker, the icon sprite) is checked every time.

# The app's areas by their first path segment. A new area of the app goes here, otherwise its
# addresses answer 404 when opened directly (tests/unit/app/serverRoutes.test.ts compares this list
# with the app's routes). Public pages are files and need no entry.
map $uri $app_area {
  default 0;
  "~^/(dashboard|konto|k|login|registrieren|aktivierung|passwort-vergessen|passwort-zuruecksetzen|auth|invitations)(/|$)" 1;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  charset utf-8;
  # Relative redirects: behind Caddy the public host and scheme are not nginx's.
  absolute_redirect off;

  rewrite ^/(.+)/$ /$1 permanent;

  error_page 404 /404.html;

  # Vite's output: name-<8 character hash>.<ext>
  location ~* "^/assets/.+-[A-Za-z0-9_-]{8}\.[a-z0-9]+$" {
    # Not on errors: a missing file must not be remembered for a year.
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  # Files from public/assets (icon sprite, decoration) keep their names.
  location /assets/ {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
    add_header Cache-Control "no-cache" always;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/index.html @app;
  }

  location @app {
    add_header Cache-Control "no-cache" always;
    if ($app_area) {
      rewrite ^ /app.html break;
    }
    return 404;
  }
}
