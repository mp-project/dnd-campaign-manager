name: dnd-campaign-manager

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: dnd_campaign_manager
      POSTGRES_USER: postgres
      # No default: every environment sets its own password in the root .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}
    # The database runs in every profile; only the local host may reach it, never other machines.
    ports:
      - "127.0.0.1:${DB_PORT}:${DB_INTERNAL_PORT}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d dnd_campaign_manager"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Rate limits, caches, later realtime and queues; no truth is kept here (the API runs without it),
  # but stage and production require it, so it runs in every profile like the database.
  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-56380}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs:
    image: rustfs/rustfs:latest
    profiles: ["development"]
    restart: always
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_CORS_ALLOWED_ORIGINS: "*"
      RUSTFS_CONSOLE_CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "${RUSTFS_API_PORT}:9000"
      - "${RUSTFS_DASHBOARD_PORT}:9001"
    volumes:
      - rustfs-data:/data

  mailpit:
    image: axllent/mailpit:latest
    profiles: ["development"]
    ports:
      - "${MAILPIT_SMTP_PORT}:1025"
      - "${MAILPIT_UI_PORT}:8025"

  adminer:
    image: adminer:4
    profiles: ["development"]
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DB_DASHBOARD_PORT}:8080"

  migrate:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: ${APP_ENV:-production}
      HOST: ${CONTAINER_HOST}
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:${DB_INTERNAL_PORT}/dnd_campaign_manager
      TEST_DATABASE_URL: postgres://postgres:postgres@db-test:${DB_TEST_INTERNAL_PORT}/dnd_campaign_manager_test
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: smtp
      MAIL_FROM_ADDRESS: benachrichtigung@${FRONTEND_DOMAIN}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-kontakt@${FRONTEND_DOMAIN}}
      # JSON lines on stdout; pino-pretty is not part of the production image.
      LOG_PRETTY: "false"
      # New values in the `change` lines while the data is still being checked.
      LOG_CHANGE_VALUES: ${LOG_CHANGE_VALUES:-true}
      MAIL_FROM_NAME: Questaria
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      MAILPIT_UI_URL: ${COMPOSE_MAILPIT_UI_URL:-http://127.0.0.1:8025}
      # Recipient of the contact form; empty = the form answers 503.
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      # Signs the contact form's JS challenge; empty = random per container start.
      CONTACT_CHALLENGE_SECRET: ${CONTACT_CHALLENGE_SECRET:-}
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${COMPOSE_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      STORAGE_S3_PUBLIC_ENDPOINT: ${COMPOSE_STORAGE_S3_PUBLIC_ENDPOINT:-https://s3.localhost:8443}
      STORAGE_S3_DASHBOARD_URL: ${COMPOSE_STORAGE_S3_DASHBOARD_URL:-http://127.0.0.1:9001}
      STORAGE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${RUSTFS_BUCKET:-dnd-manager}
      STORAGE_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_AUTO_BOOTSTRAP: "false"
      STORAGE_S3_BOOTSTRAP_CORS_ORIGINS: ${COMPOSE_FRONTEND_PUBLIC_URL},http://app.localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: npm run db:migrate --workspace @dnd/backend

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: ${APP_ENV:-production}
      HOST: ${CONTAINER_HOST}
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:${DB_INTERNAL_PORT}/dnd_campaign_manager
      TEST_DATABASE_URL: postgres://postgres:postgres@db-test:${DB_TEST_INTERNAL_PORT}/dnd_campaign_manager_test
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: smtp
      MAIL_FROM_ADDRESS: benachrichtigung@${FRONTEND_DOMAIN}
      MAIL_REPLY_TO: ${MAIL_REPLY_TO:-kontakt@${FRONTEND_DOMAIN}}
      # JSON lines on stdout; pino-pretty is not part of the production image.
      LOG_PRETTY: "false"
      # New values in the `change` lines while the data is still being checked.
      LOG_CHANGE_VALUES: ${LOG_CHANGE_VALUES:-true}
      # Name in Grafana; the OTLP endpoint and token come from apps/backend/.env.
      OTEL_SERVICE_NAME: questaria-api
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the root .env}@redis:6379/0
      # Sentry DSN comes from apps/backend/.env; the release names the deploy.
      SENTRY_RELEASE: ${APP_RELEASE:-}
      MAIL_FROM_NAME: Questaria
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      MAILPIT_UI_URL: ${COMPOSE_MAILPIT_UI_URL:-http://127.0.0.1:8025}
      # Recipient of the contact form; empty = the form answers 503.
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      # Signs the contact form's JS challenge; empty = random per container start.
      CONTACT_CHALLENGE_SECRET: ${CONTACT_CHALLENGE_SECRET:-}
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${COMPOSE_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      STORAGE_S3_PUBLIC_ENDPOINT: ${COMPOSE_STORAGE_S3_PUBLIC_ENDPOINT:-https://s3.localhost:8443}
      STORAGE_S3_DASHBOARD_URL: ${COMPOSE_STORAGE_S3_DASHBOARD_URL:-http://127.0.0.1:9001}
      STORAGE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${RUSTFS_BUCKET:-dnd-manager}
      STORAGE_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_AUTO_BOOTSTRAP: "false"
      STORAGE_S3_BOOTSTRAP_CORS_ORIGINS: ${COMPOSE_FRONTEND_PUBLIC_URL},http://app.localhost:5173
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Generates image variants; start more of them if the queue gets long.
  media-worker:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: production
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: ${APP_ENV:-production}
      HOST: ${CONTAINER_HOST}
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:${DB_INTERNAL_PORT}/dnd_campaign_manager
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      LOG_PRETTY: "false"
      STORAGE_DRIVER: s3
      STORAGE_S3_ENDPOINT: ${COMPOSE_STORAGE_S3_ENDPOINT:-http://rustfs:9000}
      STORAGE_S3_REGION: ${RUSTFS_REGION:-us-east-1}
      STORAGE_S3_BUCKET: ${RUSTFS_BUCKET:-dnd-manager}
      STORAGE_S3_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      STORAGE_S3_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      STORAGE_S3_FORCE_PATH_STYLE: "true"
      STORAGE_S3_AUTO_BOOTSTRAP: "false"
      OTEL_SERVICE_NAME: questaria-media-worker
      SENTRY_RELEASE: ${APP_RELEASE:-}
    command: ["--enable-source-maps", "--import", "./dist/instrumentation.js", "dist/workers/mediaWorker.js"]
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_API_URL}
        VITE_PUSHER_BEAMS_INSTANCE_ID: ${PUSHER_BEAMS_INSTANCE_ID:-}
        VITE_DEMO_URL: ${DEMO_URL:-}
        # Clerk's publishable key (sign-in, registration, waitlist); empty = nobody can sign in.
        VITE_CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
        # Public address of the site: canonical links, link previews, sitemap.
        VITE_SITE_URL: ${COMPOSE_FRONTEND_PUBLIC_URL}
        # Consent banner (public id) and Grafana Faro, which starts only after consent.
        VITE_COOKIEBOT_ID: ${COOKIEBOT_ID:-}
        VITE_GTM_ID: ${GTM_ID:-}
        VITE_FARO_URL: ${FARO_URL:-}
        VITE_LOG_REMOTE_LEVEL: ${LOG_REMOTE_LEVEL:-info}
        VITE_APP_ENV: ${APP_ENV:-production}
        VITE_APP_RELEASE: ${APP_RELEASE:-}
        # Errors always; Session Replay only after consent.
        VITE_SENTRY_DSN: ${SENTRY_FRONTEND_DSN:-}
        VITE_SENTRY_REPLAY_SAMPLE_RATE: ${SENTRY_REPLAY_SAMPLE_RATE:-0.1}
      # Uploads the source maps to Sentry during the build (optional; never an argument).
      secrets: [sentry_auth_token]
    depends_on:
      backend:
        condition: service_started

  caddy:
    image: caddy:2.8-alpine
    depends_on:
      backend:
        condition: service_started
      frontend:
        condition: service_started
    environment:
      API_DOMAIN: ${API_DOMAIN}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      BACKEND_PORT: ${BACKEND_PORT}
      S3_DOMAIN: ${S3_DOMAIN:-s3.localhost}
      # Decides whether search engines may index the frontend (Caddyfile, robots-<APP_ENV>).
      APP_ENV: ${APP_ENV:-production}
    ports:
      - "${CADDY_HTTP_PORT}:80"
      - "${CADDY_HTTPS_PORT}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  db-test:
    image: postgres:18
    profiles: ["test"]
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "127.0.0.1:${TEST_DB_PORT}:${DB_TEST_INTERNAL_PORT}"
    environment:
      POSTGRES_DB: dnd_campaign_manager_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U postgres -d dnd_campaign_manager_test"]
      interval: 5s
      timeout: 3s
      retries: 10

  rustfs-test:
    image: rustfs/rustfs:1.0.4
    profiles: ["test"]
    tmpfs:
      - /data:uid=10001,gid=10001
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: rustfs-test
      RUSTFS_SECRET_KEY: rustfs-test-secret
    ports:
      - "127.0.0.1:${TEST_RUSTFS_PORT:-59000}:9000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/health || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis-test:
    image: redis:8-alpine
    profiles: ["test"]
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    tmpfs:
      - /data
    ports:
      - "127.0.0.1:${TEST_REDIS_PORT:-56379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  tests:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      target: development
    profiles: ["test"]
    env_file:
      - ./apps/backend/.env
    environment:
      NODE_ENV: test
      HOST: 127.0.0.1
      PORT: ${BACKEND_PORT}
      BACKEND_PUBLIC_BASE_URL: ${COMPOSE_BACKEND_PUBLIC_BASE_URL}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the root .env}@db:${DB_INTERNAL_PORT}/dnd_campaign_manager
      TEST_DATABASE_URL: postgres://postgres:postgres@db-test:${DB_TEST_INTERNAL_PORT}/dnd_campaign_manager_test
      CORS_ORIGIN: ${COMPOSE_FRONTEND_PUBLIC_URL}
      MAIL_DRIVER: noop
      MAIL_FROM_ADDRESS: no-reply@example.test
      MAIL_FROM_NAME: DnD Tests
      MAIL_SMTP_HOST: mailpit
      MAIL_SMTP_PORT: 1025
      MAIL_SMTP_SECURE: "false"
      TEST_S3_ENDPOINT: http://rustfs-test:9000
      TEST_REDIS_URL: redis://redis-test:6379/1
    depends_on:
      db-test:
        condition: service_healthy
      rustfs-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    command: npm run test:integration --workspace @dnd/backend

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN

volumes:
  postgres-data:
  redis-data:
  rustfs-data:
  caddy-data:
  caddy-config:
