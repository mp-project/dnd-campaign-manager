<svg xmlns="http://www.w3.org/2000/svg" width="2227" height="682" viewBox="0 0 2227 682" role="img" aria-labelledby="title desc"><title id="title">Questaria – roter Drache mit feiner Goldkontur</title><desc id="desc">Drache und Flügel in Bordeaux #5c0e24 mit einer feinen Goldkontur #D4AF37. Bereinigte Flügelspitzen. Q-Ring und Wortmarke in Navy oder Weiß. Alle sichtbaren Formen sind SVG-Pfade. Am oberen Schwanzansatz ist der Q-Ring für einen sichtbaren Freiraum zurückgesetzt.</desc><g id="questaria-logo" transform="translate(19 -22)">
