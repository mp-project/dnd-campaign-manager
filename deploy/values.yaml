# Image tag: written by the workflow (.github/workflows/deploy.yml) after every build.
images:
  backend: ghcr.io/mp-project/dnd-campaign-manager-backend
  frontend: ghcr.io/mp-project/dnd-campaign-manager-frontend
  tag: 1f8574f5f2753cbb8f395393b5cacac8c25ce498
# Written by the workflow: changes when a secret changes, so the pods reading them restart.
secretsChecksum: "d301a38739a9e440"
# Public host names (without https://). Routes, origins, CORS, Clerk's authorized party and the
# frontend build (API address, site address) are all derived from these two; the workflow reads
# them from here too. Both are required.
hosts:
  frontend: www.questaria.de
  api: api.questaria.de
backend:
  port: 3000
  # Settings that are no secrets. Secrets come from the SealedSecret "app-secrets" (GitHub secrets,
  # see the workflow); the database address from the operator's secret "db-app". Empty values are
  # left out, so the app's defaults apply.
  env:
    LOG_LEVEL: info
    LOG_CHANGE_VALUES: "true"
    DEFAULT_RULESETS_ON_START: "true"
    # Mail (Plesk mailbox no-reply@questaria.de). The host is the server's own name: mail.questaria.de
    # points to the same server, but its certificate only covers *.webhosting.systems.
    MAIL_DRIVER: smtp
    MAIL_SMTP_HOST: rw0b31.webhosting.systems
    MAIL_SMTP_PORT: "465"
    MAIL_SMTP_SECURE: "true"
    MAIL_FROM_NAME: Questaria
    MAIL_FROM_ADDRESS: no-reply@questaria.de
    MAIL_REPLY_TO: info@questaria.de
    # Recipient of the contact form; empty = the form answers 503.
    CONTACT_EMAIL_TO: info@questaria.de
    # Object storage (external S3, e.g. Hetzner Object Storage: https://fsn1.your-objectstorage.com,
    # region fsn1). Signed links contain the public endpoint; it must not be the app's origin.
    # Without bucket and keys (GitHub secrets) the app runs and only file operations answer 503.
    STORAGE_DRIVER: s3
    STORAGE_S3_ENDPOINT: ""
    STORAGE_S3_PUBLIC_ENDPOINT: ""
    STORAGE_S3_REGION: ""
    STORAGE_S3_BUCKET: ""
    STORAGE_S3_FORCE_PATH_STYLE: "false"
    # true: the API creates the bucket and its CORS rule (frontend origin) on its first start; after
    # that a marker in the bucket stops it, so a later change of hosts.frontend needs the CORS rule
    # adjusted by hand.
    STORAGE_S3_AUTO_BOOTSTRAP: "true"
    # Grafana Cloud (OTLP); empty endpoint = no telemetry. The headers are a secret.
    OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp-gateway-prod-eu-west-4.grafana.net/otlp
    OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
    OTEL_TRACES_SAMPLER: parentbased_traceidratio
    OTEL_TRACES_SAMPLER_ARG: "1.0"
    LOG_EXPORT_LEVEL: info
    # Sentry: the DSN is a secret; this is the level of log lines sent to Sentry Logs.
    SENTRY_LOG_LEVEL: warn
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
# Applies the migrations before the API starts (init container, same image).
migrations:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 256Mi}
worker:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 384Mi}
# Realtime gateway (dist/realtime/server.js): small, it only holds connections and passes on
# references. Limits leave room for the media-cleanup run within the namespace's 2 GiB.
realtime:
  port: 3001
  resources:
    requests: {cpu: 10m, memory: 64Mi}
    limits: {memory: 160Mi}
# Repairs interrupted uploads and deletions (npm run media:cleanup); after the nightly backup,
# before the maintenance window.
mediaCleanup:
  schedule: "30 3 * * *"
  resources:
    requests: {cpu: 10m, memory: 96Mi}
    limits: {memory: 256Mi}
frontend:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 64Mi}
# Rate limits and caches only (no truth, no disk): a restart empties it.
redis:
  image: redis:8.2-alpine
  maxmemory: 64mb
  resources:
    requests: {cpu: 10m, memory: 32Mi}
    limits: {memory: 96Mi}
database:
  image: ghcr.io/cloudnative-pg/postgresql:18.6-minimal-trixie
  # Hetzner volumes: 10Gi minimum
  size: 10Gi
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 512Mi}
