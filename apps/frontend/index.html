<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101b24" />
    <!--
      favicon.svg switches itself: navy dragon Q on light browsers, white on dark ones (Chrome, Edge,
      Firefox). The ICO (navy) is the fallback for browsers without SVG icons, e.g. Safari. The
      192 px PNG gives Google Search a raster icon above its 48 px minimum; it stays before the SVG,
      so browsers that pick the last fitting icon keep the self-switching one.
    -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/android-chrome-192x192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Questaria – Kampagnenverwaltung für D&amp;D 5E</title>
    <!--
      Defaults of the start page for addresses without their own head (link previews of app pages,
      before the app runs). Public pages replace them through usePageMeta (same data-page-meta keys).
    -->
    <meta data-page-meta="description" name="description" content="Plane Kampagnen, verwebe Storylines, verwalte Charaktere und lade deine Gruppe zu Spielsessions ein – Questaria ist das Werkzeug für Spielleitungen und ihre Gruppen." />
    <meta data-page-meta="og:type" property="og:type" content="website" />
    <meta data-page-meta="og:site_name" property="og:site_name" content="Questaria" />
    <meta data-page-meta="og:title" property="og:title" content="Questaria – Kampagnenverwaltung für D&amp;D 5E" />
    <meta data-page-meta="og:description" property="og:description" content="Plane Kampagnen, verwebe Storylines, verwalte Charaktere und lade deine Gruppe zu Spielsessions ein – Questaria ist das Werkzeug für Spielleitungen und ihre Gruppen." />
    <meta data-page-meta="og:image" property="og:image" content="%SITE_URL%/og/start-de.jpg" />
    <meta data-page-meta="og:image:width" property="og:image:width" content="1200" />
    <meta data-page-meta="og:image:height" property="og:image:height" content="630" />
    <meta data-page-meta="og:locale" property="og:locale" content="de_DE" />
    <meta data-page-meta="twitter:card" name="twitter:card" content="summary_large_image" />
    <meta data-page-meta="twitter:image" name="twitter:image" content="%SITE_URL%/og/start-de.jpg" />
  </head>

    <div id="app"></div>
    <script src="https://js.pusher.com/beams/2.1.0/push-notifications-cdn.js"></script>

  </body>
</html>
