{{- range $name, $host := .Values.hosts }}
{{- if $host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
spec:
  parentRefs:
    - name: main
      namespace: traefik
  hostnames:
    - {{ $host }}
  rules:
    {{- if eq $name "api" }}
    # The realtime gateway under the API's host (WebSocket, long polling as fallback).
    - matches:
        - path: { type: PathPrefix, value: /realtime }
      backendRefs:
        - name: realtime
          port: 80
    {{- end }}
    - backendRefs:
        - name: {{ eq $name "api" | ternary "backend" "frontend" }}
          port: 80
{{- end }}
{{- end }}
