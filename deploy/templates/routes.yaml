{{- range $name, $host := .Values.hosts }}
{{- if $host }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
spec:
  parentRefs:
    - name: main
      namespace: traefik
  hostnames:
    - {{ $host }}
  rules:
    - backendRefs:
        - name: {{ eq $name "api" | ternary "backend" "frontend" }}
          port: 80
{{- end }}
{{- end }}
